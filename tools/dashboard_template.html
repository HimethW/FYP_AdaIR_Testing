<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYP Training Monitor</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --track: #cde2fb; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --track: #184f95; --good-text: #0ca30c;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --track: #184f95; --good-text: #0ca30c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #f9f9f7; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px 16px 48px; }
.wrap { max-width: 1280px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 28px 0 10px; }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile .label { color: var(--text-secondary); font-size: 12.5px; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
.tile .sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.hero .value { font-size: 48px; line-height: 1.05; }
.meter { height: 8px; border-radius: 4px; background: var(--track); margin-top: 8px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--s1); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 20px 0 6px; }
.filters label { color: var(--text-secondary); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
select, button { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; }
button[aria-pressed="true"] { border-color: var(--text-secondary); font-weight: 600; }
.seg { display: inline-flex; gap: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 10px; }
.grid.small { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
figure { margin: 0; }
figcaption { font-weight: 600; font-size: 13.5px; }
figcaption .sub { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 2px; font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.key { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.plot { position: relative; }
svg { display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); white-space: nowrap; z-index: 5; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip b { font-variant-numeric: tabular-nums; }
.tip .x { color: var(--text-muted); margin-bottom: 3px; }
details { margin-top: 6px; font-size: 12px; }
summary { cursor: pointer; color: var(--text-muted); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
th { color: var(--text-secondary); font-weight: 600; }
.scroll { overflow-x: auto; }
pre { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12px;
  overflow-x: auto; color: var(--text-secondary); margin: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; margin-top: 10px; }
.kv div { min-width: 0; }
.kv .k { color: var(--text-muted); font-size: 12px; }
.kv .v { font-weight: 600; overflow-wrap: anywhere; }
.empty { color: var(--text-muted); padding: 18px; text-align: center; }
.runhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.runhead .name { font-size: 17px; font-weight: 600; }
@media (max-width: 480px) { .grid, .grid.small { grid-template-columns: 1fr; } .hero .value { font-size: 40px; } }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <header>
    <h1>Training monitor</h1>
    <span class="secondary" id="host"></span>
    <span class="live" id="live"></span>
    <span style="flex:1"></span>
    <button id="theme" type="button" title="Switch light / dark">Theme</button>
  </header>

  <section class="tiles" id="tiles"></section>

  <div class="filters">
    <label>Run <select id="runsel"></select></label>
    <label>GPU <select id="gpusel"></select></label>
    <span class="seg" id="range" role="group" aria-label="GPU history range"></span>
  </div>

  <section class="card" id="runcard"></section>

  <h2>Training</h2>
  <section class="grid" id="ch-train"></section>

  <h2>Validation <span class="muted" style="font-weight:400;font-size:12.5px">(first images of each test set, during training)</span></h2>
  <section class="grid small" id="ch-val"></section>

  <h2>Mask health <span class="muted" style="font-weight:400;font-size:12.5px">(shaped-band models: share of the spectrum per band, shape params vs bounds)</span></h2>
  <section class="grid small" id="ch-mask"></section>
  <div id="shape-table" style="margin-top:10px"></div>

  <h2>GPU</h2>
  <section class="grid small" id="ch-gpu"></section>
  <div class="card" style="margin-top:10px" id="procs"></div>

  <h2>All runs</h2>
  <div class="card scroll" id="runs-table"></div>

  <h2>Evaluation results</h2>
  <div class="card scroll" id="eval-table"></div>

  <h2>Log <span class="muted" style="font-weight:400;font-size:12.5px" id="logname"></span></h2>
  <pre id="log"></pre>
</div>
</div>
<script>
"use strict";
const EMBEDDED = /*__DATA__*/null;
const REFRESH_S = 15;
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
// shape-param bounds, from patches/shaped_bands.py BOUNDS (degrees for angles)
const BOUNDS = { dot_r: null, star_theta: [-22.5, 22.5], star_p: [0.4, 1.0], star_size: [0.4, 0.95],
  star_aspect: [0.667, 1.5], lobe_vertex: [0.4, 0.9], lobe_curv: [0.1, 1.5], lobe_theta: [-30, 30] };
const state = { run: null, gpu: 0, range: 86400, data: null, theme: null };

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.querySelector(".viz-root")).getPropertyValue(v).trim();
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); return e; };
function compact(v, d = 3) {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(1) + "K";
  if (a >= 100) return v.toFixed(0);
  if (a >= 1) return v.toFixed(Math.max(0, d - 1));
  if (a === 0) return "0";
  if (a < 1e-3) return v.toExponential(1);
  return v.toPrecision(d);
}
function dur(s) {
  if (s == null || !isFinite(s)) return "–";
  s = Math.max(0, s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
const ago = (t) => dur(Date.now() / 1000 - t) + " ago";
const fmtEp = (v) => v == null ? "–" : v < 0.01 ? v.toPrecision(2) : v.toFixed(2);
const clock = (t) => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

function niceTicks(lo, hi, n = 4) {
  if (!isFinite(lo) || !isFinite(hi)) return [0, 1];
  if (lo === hi) { const p = Math.abs(lo) * 0.05 || 1; lo -= p; hi += p; }
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
  const ticks = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9 * step; v += step) ticks.push(+v.toPrecision(12));
  return ticks;
}

/* Line chart: crosshair + one tooltip listing every series, legend for >= 2 series, end labels for <= 4,
   table view. series: [{name, color, points: [[x, y], ...]}] */
function lineChart(host, o) {
  const fig = el("figure", { class: "card" });
  const cap = el("figcaption", {}, o.title);
  if (o.sub) cap.append(el("span", { class: "sub" }, o.sub));
  fig.append(cap);
  const series = o.series.filter((s) => s.points.length);
  if (!series.length) { fig.append(el("div", { class: "empty" }, "no data yet")); host.append(fig); return; }
  if (series.length >= 2) {
    const lg = el("div", { class: "legend" });
    series.forEach((s) => lg.append(el("span", {}, el("i", { class: "key", style: `background:${s.color}` }), s.name)));
    fig.append(lg);
  }
  const plot = el("div", { class: "plot" });
  fig.append(plot);
  host.append(fig);
  const W = Math.max(240, plot.clientWidth || 340), H = o.height || 170;
  const endLabels = series.length <= 4 && series.length >= 2;
  const m = { l: 44, r: endLabels ? 56 : 12, t: 8, b: 22 };
  const xs = series.flatMap((s) => s.points.map((p) => p[0]));
  const ys = series.flatMap((s) => [...s.points, ...(s.raw || [])].map((p) => p[1]));
  let x0 = o.xMin ?? Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) x1 = x0 + 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (o.yZero) y0 = Math.min(0, y0);
  if (o.yMax != null) y1 = Math.max(y1, o.yMax);
  const yt = niceTicks(y0, y1, 4); y0 = Math.min(y0, yt[0]); y1 = Math.max(y1, yt[yt.length - 1]);
  const X = (v) => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = (v) => m.t + (1 - (v - y0) / (y1 - y0 || 1)) * (H - m.t - m.b);
  const svg = svgEl("svg", { width: W, height: H, role: "img", "aria-label": o.title });
  for (const t of yt) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: css("--grid"), "stroke-width": 1 }));
    const tx = svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: css("--text-muted") });
    tx.textContent = o.yFmt ? o.yFmt(t) : compact(t); svg.append(tx);
  }
  svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css("--axis"), "stroke-width": 1 }));
  for (const t of (o.xTicks ? o.xTicks(x0, x1) : niceTicks(x0, x1, Math.max(2, Math.floor(W / 110))))) {
    if (t < x0 || t > x1) continue;
    const tx = svgEl("text", { x: X(t), y: H - 6, "text-anchor": "middle", "font-size": 11, fill: css("--text-muted") });
    tx.textContent = o.xFmt ? o.xFmt(t) : compact(t); svg.append(tx);
  }
  const clipId = "c" + Math.random().toString(36).slice(2);
  const clip = svgEl("clipPath", { id: clipId });
  clip.append(svgEl("rect", { x: m.l - 6, y: m.t - 6, width: W - m.l - m.r + 12, height: H - m.t - m.b + 12 }));
  svg.append(clip);
  const marks = svgEl("g", { "clip-path": `url(#${clipId})` });
  svg.append(marks);
  const labels = [];
  for (const s of series) {
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    if (s.raw) marks.append(svgEl("path", { d: s.raw.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(""),
      fill: "none", stroke: s.color, "stroke-width": 1, opacity: 0.28 }));
    marks.append(svgEl("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = s.points[s.points.length - 1];
    marks.append(svgEl("circle", { cx: X(last[0]), cy: Y(last[1]), r: 4, fill: s.color, stroke: css("--surface-1"), "stroke-width": 2 }));
    if (endLabels) labels.push({ y: Y(last[1]), text: s.name, x: X(last[0]) });
  }
  labels.sort((a, b) => a.y - b.y);
  const collide = labels.some((l, i) => i && l.y - labels[i - 1].y < 12);
  if (!collide) for (const l of labels) {
    const tx = svgEl("text", { x: W - m.r + 8, y: l.y + 4, "font-size": 11, fill: css("--text-secondary") });
    tx.textContent = l.text; svg.append(tx);
  }
  const cross = svgEl("line", { y1: m.t, y2: H - m.b, stroke: css("--axis"), "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const hit = svgEl("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  plot.append(svg);
  const tip = el("div", { class: "tip", style: "display:none" });
  plot.append(tip);
  const nearest = (pts, x) => { let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (pts[mid][0] < x) lo = mid; else hi = mid; }
    return Math.abs(pts[lo][0] - x) <= Math.abs(pts[hi][0] - x) ? pts[lo] : pts[hi]; };
  function show(px) {
    const x = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    const ref = nearest(series[0].points, x);
    cross.setAttribute("x1", X(ref[0])); cross.setAttribute("x2", X(ref[0])); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(el("div", { class: "x" }, o.xFmt ? o.xFmt(ref[0]) : (o.xName || "step") + " " + compact(ref[0], 6)));
    for (const s of series) {
      const p = nearest(s.points, ref[0]);
      tip.append(el("div", { class: "row" }, el("i", { class: "key", style: `background:${s.color}` }),
        el("b", {}, o.yFmt ? o.yFmt(p[1]) : compact(p[1], 4)), el("span", { class: "muted" }, series.length > 1 ? s.name : "")));
    }
    tip.style.display = "block";
    const left = Math.min(Math.max(0, X(ref[0]) + 12), W - tip.offsetWidth);
    tip.style.left = (X(ref[0]) + 12 + tip.offsetWidth > W ? X(ref[0]) - tip.offsetWidth - 12 : left) + "px";
    tip.style.top = "6px";
  }
  hit.addEventListener("pointermove", (e) => show(e.offsetX));
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
  hit.addEventListener("focus", () => show(W - m.r));
  hit.addEventListener("blur", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
  // table view (accessibility twin)
  const det = el("details", {}, el("summary", {}, "Table"));
  const tbl = el("table");
  const head = el("tr", {}, el("th", {}, o.xName || "step"));
  series.forEach((s) => head.append(el("th", { class: "num" }, s.name)));
  tbl.append(head);
  const xsAll = [...new Set(series[0].points.map((p) => p[0]))].slice(-25).reverse();
  for (const x of xsAll) {
    const tr = el("tr", {}, el("td", {}, o.xFmt ? o.xFmt(x) : compact(x, 6)));
    series.forEach((s) => { const p = nearest(s.points, x); tr.append(el("td", { class: "num" }, o.yFmt ? o.yFmt(p[1]) : compact(p[1], 4))); });
    tbl.append(tr);
  }
  det.append(el("div", { class: "scroll" }, tbl));
  fig.append(det);
}

function timeTicks(t0, t1) {
  const steps = [300, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
  const step = steps.find((st) => (t1 - t0) / st <= 6) || 86400;
  const off = new Date().getTimezoneOffset() * 60;  // align to local clock times
  const ticks = [];
  for (let t = Math.ceil((t0 - off) / step) * step + off; t <= t1; t += step) ticks.push(t);
  return ticks;
}
function ema(points, a = 0.9) {
  let m = null;
  return points.map(([x, y]) => [x, m = m == null ? y : a * m + (1 - a) * y]);
}
function tile(label, value, sub, opts = {}) {
  const t = el("div", { class: "card tile" + (opts.hero ? " hero" : "") }, el("div", { class: "label" }, label),
    el("div", { class: "value" }, value));
  if (opts.status) t.append(statusChip(opts.status[0], opts.status[1]));
  if (opts.meter != null) t.append(el("div", { class: "meter", role: "meter", "aria-valuenow": Math.round(opts.meter * 100) },
    el("i", { style: `width:${Math.min(100, Math.max(0, opts.meter * 100)).toFixed(1)}%;background:${opts.meterColor || "var(--s1)"}` })));
  if (sub) t.append(el("div", { class: "sub" }, sub));
  return t;
}
const STATUS = { good: ["var(--good)", "●"], warning: ["var(--warning)", "▲"], serious: ["var(--serious)", "▲"],
  critical: ["var(--critical)", "■"], idle: ["var(--text-muted)", "○"] };
function statusChip(kind, label) {
  const [c, icon] = STATUS[kind] || STATUS.idle;
  return el("span", { class: "status" }, el("span", { style: `color:${c}`, "aria-hidden": "true" }, icon), label);
}
const RUN_STATUS = { running: ["good", "Running"], finished: ["good", "Finished"], stopped: ["warning", "Stopped (resumable)"],
  "not running": ["idle", "Not running"] };

function render(data) {
  state.data = data;
  $("host").textContent = `${data.host} · updated ${clock(data.updated)}`;
  const live = location.protocol.startsWith("http");
  $("live").replaceChildren(statusChip(live ? "good" : "idle", live ? `live, refreshes every ${REFRESH_S}s` : "snapshot"));

  // GPU selector
  const gsel = $("gpusel");
  if (gsel.options.length !== data.gpus.length) {
    gsel.replaceChildren(...data.gpus.map((g) => el("option", { value: g.index }, `GPU ${g.index} · ${g.name}`)));
    gsel.value = state.gpu;
  }
  const g = data.gpus[state.gpu] || data.gpus[0] || {};
  const sys = data.system;
  const diskKind = sys.disk_free < 10 ? "critical" : sys.disk_free < 30 ? "warning" : "good";
  const memFrac = g.mem_total ? g.mem_used / g.mem_total : 0;
  $("tiles").replaceChildren(
    tile("GPU utilization", `${Math.round(g.util || 0)}%`, `${g.name || ""}`, { hero: true, meter: (g.util || 0) / 100 }),
    tile("GPU memory", `${(g.mem_used / 1024).toFixed(1)} / ${(g.mem_total / 1024).toFixed(1)} GB`, `${Math.round(memFrac * 100)}% used`,
      { meter: memFrac }),
    tile("GPU temperature · power", `${Math.round(g.temp)} °C`, `${Math.round(g.power)} W of ${Math.round(g.power_limit)} W`),
    tile("Disk free (Himeth's filesystem)", `${Math.round(sys.disk_free)} GB`, `of ${(sys.disk_total / 1000).toFixed(1)} TB`,
      { status: [diskKind, diskKind === "good" ? "OK" : diskKind === "warning" ? "Getting low" : "Critically low"],
        meter: 1 - sys.disk_free / sys.disk_total, meterColor: `var(--${diskKind === "good" ? "s1" : diskKind})` }),
    tile("RAM available", `${Math.round(sys.ram_avail)} GB`, `of ${Math.round(sys.ram_total)} GB`, { meter: 1 - sys.ram_avail / sys.ram_total }),
    tile("CPU load (1 / 5 / 15 min)", sys.load.map((v) => v.toFixed(1)).join(" / "), `${sys.cpus} threads`));

  // run selector: keep the choice, default = running run, else the most recently updated
  const runs = data.runs.filter((r) => !r.error);
  const rsel = $("runsel");
  rsel.replaceChildren(...runs.map((r) => el("option", { value: r.name }, `${r.name} (${(RUN_STATUS[r.status] || [0, r.status])[1]})`)));
  if (!runs.find((r) => r.name === state.run)) {
    const pick = runs.find((r) => r.status === "running") || [...runs].sort((a, b) => b.updated - a.updated)[0];
    state.run = pick ? pick.name : null;
  }
  if (state.run) rsel.value = state.run;
  rsel.disabled = !runs.length;
  const run = runs.find((r) => r.name === state.run);
  renderRun(run);
  renderGpu(data);
  renderTables(data, runs);
}

function renderRun(r) {
  const card = $("runcard"), ids = ["ch-train", "ch-val", "ch-mask"];
  ids.forEach((i) => $(i).replaceChildren());
  $("shape-table").replaceChildren();
  if (!r) {
    card.replaceChildren(el("div", { class: "empty" }, "No training runs yet. They will appear here as soon as one starts (runs/<name>/)."));
    $("log").textContent = ""; $("logname").textContent = ""; return;
  }
  const a = r.args, sps = r.samples_per_step, pe = r.per_epoch;
  const ep = pe ? r.step * sps / pe : null, epTotal = pe ? r.iters * sps / pe : null;
  const ips = r.last.img_per_s ? r.last.img_per_s[1] : null;
  const eta = ips ? (r.iters - r.step) * sps / ips : null;
  const [kind, label] = RUN_STATUS[r.status] || ["idle", r.status];
  const frac = r.iters ? r.step / r.iters : 0;
  const kv = (k, v) => el("div", {}, el("div", { class: "k" }, k), el("div", { class: "v" }, v));
  card.replaceChildren(
    el("div", { class: "runhead" }, el("span", { class: "name" }, r.name), statusChip(kind, label),
      el("span", { class: "muted" }, `${a.variant} · ${a.stage} · ${a.tasks}`)),
    el("div", { class: "meter", role: "meter", "aria-valuenow": Math.round(frac * 100), style: "height:10px;margin-top:10px" },
      el("i", { style: `width:${(frac * 100).toFixed(2)}%` })),
    el("div", { class: "kv" },
      kv("Iterations", `${r.step.toLocaleString()} / ${(r.iters || 0).toLocaleString()} (${(frac * 100).toFixed(1)}%)`),
      kv("Epochs", ep != null ? `${fmtEp(ep)} / ${fmtEp(epTotal)}` : "–"),
      kv("ETA", r.status === "running" ? dur(eta) : "–"),
      kv("Speed", ips ? `${ips.toFixed(1)} img/s` : "–"),
      kv("Learning rate", r.last.lr ? r.last.lr[1].toExponential(2) : "–"),
      kv("Last update", ago(r.updated)),
      kv("Started", r.started || "–"),
      kv("Batch", `${a.batch} × ${a.accum} = ${sps}`),
      kv("Precision", `${a.precision}${a.tf32 ? " + TF32" : " (true fp32)"}`),
      kv("Loss", a.stage === "dcpt" ? "DCPT: L1(clean) + focal" : a.loss === "l1_fft" ? `L1 + ${a.fft_weight} FFT (${a.fft_norm})` : "L1"),
      kv("Init", a.init ? `${a.init.split("/").slice(-2).join("/")}${a.init_backbone ? " (backbone)" : ""}` : "scratch"),
      kv("Frozen backbone", a.freeze_backbone ? (a.freeze_backbone < 0 ? "whole run" : `first ${a.freeze_backbone} it`) : "no"),
      kv("Checkpoints", r.ckpts.length ? r.ckpts.map((c) => c.name).join(", ") : "none yet"),
      kv("PID", r.pid || "–")));

  const S = r.series, col = (i) => css(SERIES[i % 8]);
  const lineOf = (key, name, i = 0, smooth = false) => S[key] ? [{ name, color: col(i), points: smooth ? ema(S[key]) : S[key], raw: smooth ? S[key] : null }] : [];
  const tr = $("ch-train");
  lineChart(tr, { title: "Training loss", sub: "smoothed, raw faint", series: lineOf("train/loss", "loss", 0, true) });
  if (S["train/l_pix"]) lineChart(tr, { title: a.stage === "dcpt" ? "L1 on clean images" : "Pixel L1", series: lineOf("train/l_pix", "l_pix", 0, true) });
  if (S["train/l_fft"]) lineChart(tr, { title: "FFT L1", series: lineOf("train/l_fft", "l_fft", 0, true) });
  if (S["train/l_cls"]) lineChart(tr, { title: "DCPT classification loss (focal)", series: lineOf("train/l_cls", "l_cls", 0, true) });
  if (S["train/acc"]) lineChart(tr, { title: "DCPT train accuracy", series: lineOf("train/acc", "acc", 0, true), yFmt: (v) => (v * 100).toFixed(0) + "%" });
  lineChart(tr, { title: "Learning rate", series: lineOf("lr", "lr"), yFmt: (v) => v.toExponential(1) });
  lineChart(tr, { title: "Speed", sub: "images / s", series: lineOf("img_per_s", "img/s") });

  const va = $("ch-val");
  const psnrKeys = Object.keys(S).filter((k) => /^val\/.*_psnr$/.test(k));
  if (S["val/dcpt_top1"]) {
    lineChart(va, { title: "DCPT top-1 accuracy (test images)", series: lineOf("val/dcpt_top1", "top-1"), yFmt: (v) => (v * 100).toFixed(0) + "%" });
    const per = Object.keys(S).filter((k) => /^val\/dcpt_/.test(k) && k !== "val/dcpt_top1");
    lineChart(va, { title: "DCPT accuracy per test set", series: per.map((k, i) => ({ name: k.slice(9), color: col(i), points: S[k] })),
      yFmt: (v) => (v * 100).toFixed(0) + "%" });
  }
  for (const k of psnrKeys) lineChart(va, { title: k.slice(4, -5), sub: "PSNR (dB)", series: lineOf(k, "PSNR"), yFmt: (v) => v.toFixed(2) });
  if (!psnrKeys.length && !S["val/dcpt_top1"]) va.append(el("div", { class: "card empty" }, "no validation yet"));

  const ma = $("ch-mask");
  const bands = ["dot", "star", "lobe", "rest"];
  let anyMask = false;
  for (const f of ["fre1", "fre2", "fre3"]) {
    const ss = bands.map((b, i) => ({ name: b, color: col(i), points: S[`band_area/${f}/${b}`] || [] }));
    if (ss.some((s) => s.points.length)) {
      anyMask = true;
      lineChart(ma, { title: `${f} band areas`, sub: "share of the spectrum", series: ss, yFmt: (v) => (v * 100).toFixed(0) + "%", yZero: true });
    }
  }
  if (!anyMask) ma.append(el("div", { class: "card empty" }, a.variant.startsWith("shaped") ? "no mask data yet" : "not a shaped-band model"));
  const params = Object.keys(BOUNDS);
  const rows = ["fre1", "fre2", "fre3"].filter((f) => params.some((p) => r.last[`shape/${f}/${p}`]));
  if (rows.length) {
    const t = el("table");
    const h = el("tr", {}, el("th", {}, "AFLB"));
    params.forEach((p) => h.append(el("th", { class: "num" }, p + (BOUNDS[p] ? ` [${BOUNDS[p][0]}, ${BOUNDS[p][1]}]` : ""))));
    t.append(h);
    for (const f of rows) {
      const tr2 = el("tr", {}, el("td", {}, f));
      for (const p of params) {
        const v = r.last[`shape/${f}/${p}`];
        let val = v ? v[1] : null;
        if (val != null && p.endsWith("theta")) val = val * 180 / Math.PI;
        const b = BOUNDS[p];
        const nearEdge = b && val != null && (val - b[0] < 0.03 * (b[1] - b[0]) || b[1] - val < 0.03 * (b[1] - b[0]));
        const td = el("td", { class: "num" }, val == null ? "–" : compact(val, 3));
        if (nearEdge) td.append(" ", statusChip("warning", "at bound"));
        tr2.append(td);
      }
      t.append(tr2);
    }
    $("shape-table").append(el("div", { class: "card scroll" }, el("div", { style: "font-weight:600;font-size:13.5px;margin-bottom:6px" },
      "Shape parameters (latest batch mean; angles in degrees; dot_r = 50%-energy radius x learned scale)"), t));
  }
  $("logname").textContent = `runs/${r.name}/train.log (last 25 lines)`;
  $("log").textContent = r.log.join("\n");
}

function renderGpu(data) {
  const now = data.updated, from = now - state.range, gi = state.gpu;
  const pts = data.gpu_history.filter((h) => h[0] >= from && h[1 + gi]).map((h) => [h[0], h[1 + gi]]);
  const pick = (j) => pts.filter((p) => p[1][j] != null).map((p) => [p[0], p[1][j]]);
  const xFmt = (t) => new Date(t * 1000).toLocaleTimeString([], state.range > 86400 ? { weekday: "short", hour: "2-digit" } : { hour: "2-digit", minute: "2-digit" });
  const host = $("ch-gpu"); host.replaceChildren();
  const common = { xFmt, xName: "time", xMin: from, height: 140, xTicks: timeTicks };
  lineChart(host, { ...common, title: "Utilization", sub: "%", series: [{ name: "util", color: css("--s1"), points: pick(0) }], yZero: true, yMax: 100 });
  lineChart(host, { ...common, title: "Memory used", sub: "GB", series: [{ name: "memory", color: css("--s1"), points: pick(1).map(([t, v]) => [t, v / 1024]) }], yZero: true });
  lineChart(host, { ...common, title: "Temperature", sub: "°C", series: [{ name: "temp", color: css("--s1"), points: pick(2) }] });
  lineChart(host, { ...common, title: "Power", sub: "W", series: [{ name: "power", color: css("--s1"), points: pick(3) }], yZero: true });
  const p = $("procs");
  if (!data.gpu_procs.length) { p.replaceChildren(el("div", { class: "muted" }, "No compute processes on the GPU.")); return; }
  const t = el("table", {}, el("tr", {}, el("th", {}, "PID"), el("th", {}, "User"), el("th", {}, "Process"), el("th", { class: "num" }, "GPU memory")));
  for (const q of data.gpu_procs) t.append(el("tr", {}, el("td", {}, q.pid), el("td", {}, q.user), el("td", {}, q.name), el("td", { class: "num" }, `${compact(q.mem / 1024)} GB`)));
  p.replaceChildren(el("div", { style: "font-weight:600;font-size:13.5px;margin-bottom:6px" }, "Processes on the GPU"), t);
}

const MAIN_SETS = ["bsd68_s25", "rain100l", "sots_unseen", "haze_noise25_unseen", "rain_noise25", "haze_rain_unseen", "haze_rain_cdd11"];
function renderTables(data, runs) {
  const rt = $("runs-table");
  if (!runs.length) { rt.replaceChildren(el("div", { class: "empty" }, "no runs yet")); }
  else {
    const t = el("table");
    const h = el("tr", {}, el("th", {}, "Run"), el("th", {}, "Status"), el("th", {}, "Model"), el("th", { class: "num" }, "Progress"),
      el("th", { class: "num" }, "Epochs"), el("th", { class: "num" }, "Loss"));
    MAIN_SETS.forEach((s) => h.append(el("th", { class: "num" }, s)));
    t.append(h);
    for (const r of runs) {
      const ep = r.per_epoch ? fmtEp(r.step * r.samples_per_step / r.per_epoch) : "–";
      const [kind, label] = RUN_STATUS[r.status] || ["idle", r.status];
      const row = el("tr", {}, el("td", {}, r.name), el("td", {}, statusChip(kind, label)),
        el("td", {}, `${r.args.variant} · ${r.args.stage}`), el("td", { class: "num" }, `${r.step} / ${r.iters}`),
        el("td", { class: "num" }, ep), el("td", { class: "num" }, r.last["train/loss"] ? compact(r.last["train/loss"][1], 4) : "–"));
      MAIN_SETS.forEach((s) => { const v = r.last[`val/${s}_psnr`]; row.append(el("td", { class: "num" }, v ? v[1].toFixed(2) : "–")); });
      t.append(row);
    }
    rt.replaceChildren(t, el("div", { class: "muted", style: "font-size:12px;margin-top:6px" },
      "PSNR columns: latest in-training validation (first images of each set only); final numbers come from eval_fyp.py below."));
  }
  const et = $("eval-table");
  const evals = [];
  for (const [f, res] of Object.entries(data.released || {})) evals.push(["released AdaIR", f, res]);
  for (const r of runs) for (const [f, res] of Object.entries(r.evals || {})) evals.push([r.name, f, res]);
  if (!evals.length) { et.replaceChildren(el("div", { class: "empty" }, "no eval_fyp.py results yet")); return; }
  const sets = [...new Set(evals.flatMap((e) => Object.keys(e[2])))];
  const t = el("table");
  const h = el("tr", {}, el("th", {}, "Model"), el("th", {}, "File"));
  sets.forEach((s) => h.append(el("th", { class: "num" }, s)));
  t.append(h);
  for (const [m, f, res] of evals) {
    const row = el("tr", {}, el("td", {}, m), el("td", { class: "muted" }, f));
    sets.forEach((s) => row.append(el("td", { class: "num" }, res[s] ? `${res[s][0].toFixed(2)} / ${res[s][1].toFixed(3)}` : "–")));
    t.append(row);
  }
  et.replaceChildren(t, el("div", { class: "muted", style: "font-size:12px;margin-top:6px" }, "PSNR (dB) / SSIM, full test sets, true fp32."));
}

// controls
const RANGES = [["1h", 3600], ["6h", 21600], ["24h", 86400], ["7d", 604800]];
$("range").replaceChildren(...RANGES.map(([l, s]) => { const b = el("button", { type: "button", "aria-pressed": String(s === state.range) }, l);
  b.addEventListener("click", () => { state.range = s; [...$("range").children].forEach((c, i) => c.setAttribute("aria-pressed", String(RANGES[i][1] === s))); render(state.data); });
  return b; }));
$("runsel").addEventListener("change", (e) => { state.run = e.target.value; render(state.data); });
$("gpusel").addEventListener("change", (e) => { state.gpu = +e.target.value; render(state.data); });
try { state.theme = localStorage.getItem("fyp-dash-theme"); } catch (e) { /* storage blocked */ }
if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  state.theme = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  try { localStorage.setItem("fyp-dash-theme", state.theme); } catch (e) { /* ignore */ }
  render(state.data);
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => state.data && render(state.data), 200); });

async function refresh() {
  try {
    const r = await fetch("data.json?" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("live").replaceChildren(statusChip("warning", "can't reach the server, showing the last data"));
  }
}
if (EMBEDDED) render(EMBEDDED);
if (location.protocol.startsWith("http")) { if (!EMBEDDED) refresh(); setInterval(refresh, REFRESH_S * 1000); }
</script>
</body>
</html>
